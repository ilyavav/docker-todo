<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои задачи</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <main>
        <h1>Мои задачи</h1>

        <form id="task-form">
            <label for="task-name">Новая задача</label>

            <div class="form-row">
                <input id="task-name"
                       type="text"
                       placeholder="Что нужно сделать?"
                       autocomplete="off"
                       required>

                <button id="add-button" type="submit">Добавить</button>
            </div>
        </form>

        <button id="reload-button" type="button">Обновить список</button>

        <p id="status" role="status"></p>
        <ul id="tasks"></ul>
    </main>
</body>
</html>
