name: docker-todo

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tododb}
      POSTGRES_USER: ${POSTGRES_USER:-todouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_local_password}
    # Только для запуска API из Visual Studio. Доступно лишь с этого компьютера.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/egor/Dockerfile
    image: docker-todo:multi
    restart: unless-stopped
    environment:
      ConnectionStrings__TodoDb: "Host=db;Port=5432;Database=${POSTGRES_DB:-tododb};Username=${POSTGRES_USER:-todouser};Password=${POSTGRES_PASSWORD:-todo_local_password}"
    depends_on:
      db:
        condition: service_healthy
    # Порты наружу не публикуются: вход только через nginx.

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./docker/ilya/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
